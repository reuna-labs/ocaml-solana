name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  sdk-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: conformance/kit/package-lock.json
      - run: npm ci --prefix conformance/kit
      - name: Regenerate Kit 8.0.0 fixtures
        run: |
          node conformance/kit/generate.mjs > /tmp/kit-token.json
          diff -u conformance/fixtures/kit-8.0.0-token.json /tmp/kit-token.json
      - uses: dtolnay/rust-toolchain@d77020bf130f2e8c39c025bf9c4c3a445fe2b9fa # 1.89.0
      - name: Regenerate Agave 4.2.1 fixtures
        run: |
          cargo run --locked --quiet --manifest-path conformance/agave/Cargo.toml > /tmp/agave-token.json
          diff -u conformance/fixtures/agave-4.2.1-token.json /tmp/agave-token.json

  build:
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["4.14.2", "5.2.1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-local-packages: "*.opam"
          opam-disable-sandboxing: true

      - name: Build the GMP prerequisite without host privileges
        env:
          GMP_VERSION: "6.3.0"
          GMP_SHA256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898
        run: |
          archive="$RUNNER_TEMP/gmp-$GMP_VERSION.tar.xz"
          source_dir="$(mktemp --directory "$RUNNER_TEMP/gmp-build.XXXXXX")"
          gmp_prefix="$RUNNER_TEMP/ocaml-solana-gmp-${{ matrix.ocaml-compiler }}"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --output "$archive" \
            "https://ftp.gnu.org/gnu/gmp/gmp-$GMP_VERSION.tar.xz"
          echo "$GMP_SHA256  $archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$source_dir" \
            --strip-components 1
          cd "$source_dir"
          ./configure --prefix="$gmp_prefix" --with-pic
          make -j"$(nproc)"
          make install
          {
            echo "CPATH=$gmp_prefix/include"
            echo "LIBRARY_PATH=$gmp_prefix/lib"
            echo "LD_LIBRARY_PATH=$gmp_prefix/lib"
            echo "PKG_CONFIG_PATH=$gmp_prefix/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Pin lean codecs
        run: |
          opam pin add -yn web3-codec-basen ./vendor/web3-codec
          opam pin add -yn web3-codec-base58 ./vendor/web3-codec
          opam pin add -yn web3-codec-borsh ./vendor/web3-codec

      - name: Install dependencies against the private GMP prefix
        run: opam install -y --assume-depexts --deps-only --with-test .
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest

      - name: Prove the shared workflow links through Mirage without Unix RPC
        run: >-
          opam exec -- dune build
          mirage-smoke/smoke.exe
          mirage-smoke/unikernel.exe

name: devnet smoke

on:
  workflow_dispatch:

jobs:
  transfer:
    # Keep the guarded live job on the same trusted Reuna runner used by the
    # other signing smokes. This also avoids making testnet evidence depend on
    # GitHub-hosted runner billing state.
    runs-on: ubuntu-latest
    environment: devnet
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.1"
          opam-local-packages: "*.opam"

      - name: Build the GMP prerequisite without host privileges
        env:
          GMP_VERSION: "6.3.0"
          GMP_SHA256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898
        run: |
          archive="$RUNNER_TEMP/gmp-$GMP_VERSION.tar.xz"
          source_dir="$(mktemp --directory "$RUNNER_TEMP/gmp-build.XXXXXX")"
          gmp_prefix="$RUNNER_TEMP/ocaml-solana-gmp-devnet"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --output "$archive" \
            "https://ftp.gnu.org/gnu/gmp/gmp-$GMP_VERSION.tar.xz"
          echo "$GMP_SHA256  $archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$source_dir" \
            --strip-components 1
          cd "$source_dir"
          ./configure --prefix="$gmp_prefix" --with-pic
          make -j"$(nproc)"
          make install
          echo "CPATH=$gmp_prefix/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$gmp_prefix/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$gmp_prefix/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$gmp_prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Pin lean codecs
        run: |
          opam pin add -yn web3-codec-basen ./vendor/web3-codec
          opam pin add -yn web3-codec-base58 ./vendor/web3-codec
          opam pin add -yn web3-codec-borsh ./vendor/web3-codec
      - run: opam install -y --assume-depexts --deps-only .
      - name: Simulate, submit, and confirm a small Devnet transfer
        env:
          SOLANA_ENABLE_NETWORK_TESTS: "1"
          SOLANA_SEED_HEX: ${{ secrets.SOLANA_DEVNET_SEED_HEX }}
          SOLANA_DESTINATION: ${{ vars.SOLANA_DEVNET_DESTINATION }}
          SOLANA_EXPECTED_GENESIS_HASH: ${{ vars.SOLANA_DEVNET_GENESIS_HASH }}
          # The disposable destination is a new system account. Its first
          # transfer must clear Devnet's rent-exempt minimum; 5,000 lamports
          # is rejected by simulation with InsufficientFundsForRent.
          SOLANA_LAMPORTS: "1000000"
          SOLANA_TOKEN_MINT: ${{ vars.SOLANA_DEVNET_TOKEN_MINT }}
          SOLANA_TOKEN_AMOUNT: ${{ vars.SOLANA_DEVNET_TOKEN_AMOUNT }}
          SOLANA_TOKEN_DECIMALS: ${{ vars.SOLANA_DEVNET_TOKEN_DECIMALS }}
          SOLANA_TOKEN_PROGRAM: ${{ vars.SOLANA_DEVNET_TOKEN_PROGRAM }}
          SOLANA_ALLOW_TOKEN_2022: ${{ vars.SOLANA_DEVNET_ALLOW_TOKEN_2022 }}
        run: opam exec -- dune exec solana-devnet-transfer
